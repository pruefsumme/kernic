# Kernic on one machine. See docs/self-hosting.md.
#
#   cp .env.example .env    # then edit .env
#   docker compose up -d --build
#
# Run the commands from this directory.
name: kernic

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${KERNIC_HTTP_PORT:-80}:80'
      - '${KERNIC_HTTPS_PORT:-443}:443'
    environment:
      KERNIC_SITE_ADDRESS: ${KERNIC_SITE_ADDRESS:?set KERNIC_SITE_ADDRESS in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: kernic-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://kernic:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/kernic
      KERNIC_WORKER_URL: http://worker:3101
      KERNIC_WORKER_TOKEN: ${KERNIC_WORKER_TOKEN:?set KERNIC_WORKER_TOKEN in deploy/.env}
      KERNIC_SETUP_TOKEN: ${KERNIC_SETUP_TOKEN:-}
      KERNIC_PACKAGE_REGISTRY: ${KERNIC_PACKAGE_REGISTRY:-https://packages.typst.org}
      KERNIC_MAX_FILE_MB: ${KERNIC_MAX_FILE_MB:-25}
      KERNIC_MAX_PROJECT_MB: ${KERNIC_MAX_PROJECT_MB:-200}
      KERNIC_MAX_PROJECT_FILES: ${KERNIC_MAX_PROJECT_FILES:-2000}
    volumes:
      - kernic-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [edge, database, compile]
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy

  # Compiles untrusted documents. It gets no secrets of the app, no persistent
  # storage, a read-only root file system, no capabilities, and sits on a
  # network that has no route to the internet or to the database.
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: kernic-worker
    restart: unless-stopped
    environment:
      KERNIC_WORKER_TOKEN: ${KERNIC_WORKER_TOKEN:?set KERNIC_WORKER_TOKEN in deploy/.env}
      KERNIC_COMPILE_TIMEOUT_MS: ${KERNIC_COMPILE_TIMEOUT_MS:-20000}
    read_only: true
    tmpfs:
      # Job files and the blob cache live in memory and vanish with the container.
      - /work:uid=1000,gid=1000,mode=0700,size=1g
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: ${KERNIC_WORKER_CPUS:-2}
    mem_limit: ${KERNIC_WORKER_MEMORY:-4g}
    networks: [compile]

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kernic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: kernic
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -h makes this fail during first-run init, when Postgres only listens on its socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U kernic -d kernic']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]

networks:
  # Proxy <-> app. The only network with a route to the outside.
  edge:
  # App <-> PostgreSQL.
  database:
    internal: true
  # App <-> worker.
  compile:
    internal: true

volumes:
  # Project files, rendered pages and staged imports.
  kernic-data:
  postgres-data:
  caddy-data:
  caddy-config:
