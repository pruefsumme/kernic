# Checks every change the way a release is checked: static checks, unit tests,
# the browser suite against the production build, the kill-during-save check,
# and then the same browser suite against the Docker Compose deployment.
#
# Actions are pinned to exact commits; update the commit and the version
# comment together.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kernic
          POSTGRES_PASSWORD: kernic
          POSTGRES_DB: kernic_test
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U kernic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag names the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          for manifest in apps/web/package.json apps/worker/package.json; do
            test "$(node -p "require('./$manifest').version")" = "$version"
          done
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "The tag $GITHUB_REF_NAME does not match the version $version in the code."
            exit 1
          }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Typst, Tinymist and bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu keeps unprivileged processes from creating the namespaces
          # bubblewrap confines a compile with; the tests need them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo scripts/install-typst-tools.sh

      - name: Type checks
        run: pnpm check
      - name: Formatting and lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test

      - name: Install the test browser
        run: pnpm --filter @kernic/web exec playwright install --with-deps chromium
      - name: Browser tests against the production build
        run: pnpm test:e2e
      - name: Kill-during-save check
        run: pnpm test:durability
        env:
          KERNIC_DURABILITY_ROUNDS: 30
      - name: Refusal of a database the app cannot use
        run: pnpm test:migrations

      - name: Keep traces and server logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            apps/web/e2e/.results
            apps/web/e2e/.logs
          include-hidden-files: true
          retention-days: 7

  deployment:
    name: Docker Compose deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the test browser
        run: pnpm --filter @kernic/web exec playwright install --with-deps chromium

      - name: Build the images and start the stack
        working-directory: deploy
        run: |
          cat > .env <<'ENV'
          KERNIC_SITE_ADDRESS=:80
          KERNIC_HTTP_PORT=8088
          KERNIC_HTTPS_PORT=8443
          POSTGRES_PASSWORD=ci-only-postgres-password
          KERNIC_WORKER_TOKEN=ci-only-worker-token-0123456789
          KERNIC_SETUP_TOKEN=ci-setup-token
          ENV
          docker compose up -d --build --wait

      - name: The worker confines compiles and offers editor assistance
        working-directory: deploy
        run: |
          docker compose logs worker
          docker compose logs worker | grep -q "confined with Landlock"
          docker compose exec -T worker node --input-type=module -e "
            const health = await (await fetch('http://127.0.0.1:3101/healthz')).json();
            console.log(health);
            if (health.sandbox !== 'landlock' || health.editorAssistance !== true) process.exit(1);
          "

      - name: The Git in the app image can merge and fetch the way pulling needs
        working-directory: deploy
        run: |
          docker compose exec -T app sh -ec '
            git --version
            cd "$(mktemp -d)"
            export GIT_CONFIG_GLOBAL=/dev/null GIT_AUTHOR_NAME=a GIT_AUTHOR_EMAIL=a@example.org \
              GIT_COMMITTER_NAME=a GIT_COMMITTER_EMAIL=a@example.org
            git init -q -b main project && cd project
            echo mine > mine.typ && git add . && git commit -q -m mine
            git checkout -q --orphan theirs && git rm -rfq . && echo theirs > theirs.typ
            git add . && git commit -q -m theirs && git checkout -q main
            cd .. && git init -q --bare -b main copy.git
            # What the app runs: a fetch into a private reference, then a merge computed without files.
            git --git-dir=copy.git fetch --quiet --no-tags --no-recurse-submodules --no-write-fetch-head \
              "$PWD/project" +refs/heads/theirs:refs/kernic/remote/head
            git --git-dir=copy.git fetch --quiet --no-tags --no-write-fetch-head \
              "$PWD/project" +refs/heads/main:refs/heads/main
            git --git-dir=copy.git merge-tree --write-tree -z --allow-unrelated-histories \
              main refs/kernic/remote/head | tr "\0" "\n" | head -1 | grep -Eq "^[0-9a-f]{40}$"
            echo "fetch and merge-tree work"
          '

      - name: Browser tests against the deployment
        working-directory: apps/web
        run: pnpm exec playwright test
        env:
          KERNIC_E2E_BASE_URL: http://localhost:8088
          KERNIC_E2E_SETUP_TOKEN: ci-setup-token

      - name: Show the logs of a failed run
        if: failure()
        working-directory: deploy
        run: docker compose logs --tail 200
      - name: Keep traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-results
          path: apps/web/e2e/.results
          include-hidden-files: true
          retention-days: 7

  arm64:
    # Emulated, and therefore slow: only for releases and on request.
    name: Images for ARM64
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the worker image
        run: docker buildx build --platform linux/arm64 --load -t kernic-worker:arm64 -f apps/worker/Dockerfile .
      - name: Build the app image
        run: docker buildx build --platform linux/arm64 --load -t kernic-app:arm64 -f apps/web/Dockerfile .
      - name: The tools in the worker image run
        run: |
          docker run --rm --platform linux/arm64 kernic-worker:arm64 typst --version
          docker run --rm --platform linux/arm64 kernic-worker:arm64 tinymist --version
          docker run --rm --platform linux/arm64 kernic-app:arm64 node --version

  publish:
    # Only for a release: the images people run, for x86-64 and ARM64, once everything else passed.
    name: Publish images
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, deployment, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the image names
        id: names
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          echo "app=ghcr.io/$owner/kernic-app" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/$owner/kernic-worker" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A pre-release (0.2.0-rc1) does not become "latest".
          case "$version" in *-*) echo "latest=false" >> "$GITHUB_OUTPUT" ;; *) echo "latest=true" >> "$GITHUB_OUTPUT" ;; esac
      - name: Publish the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.app }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.latest == 'true' && format('{0}:latest', steps.names.outputs.app) || '' }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Publish the worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.worker }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.latest == 'true' && format('{0}:latest', steps.names.outputs.worker) || '' }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
